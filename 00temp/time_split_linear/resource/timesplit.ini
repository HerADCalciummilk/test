# 预报时效拆分运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行，例如：python -m cli.cal_griddata_TimeSplit_plugin_cli
# 路径、起报时间和时效列表留空时必须由命令行传入。

[cli]
# timesplit。预设 timesplit
module=timesplit

[timesplit]
# 下列 input_fh / input_fmt / time / uv_fmt / is_fill0 供 CLI 读数，不进插件构造
# 输入时效 start,stop,step，含 stop，如 0,72,3。留空表示未设置
input_fh=
# 输出时效 start,stop,step，含 stop。is_min=false 时单位是小时，如 0,72,1；
# is_min=true 时单位是分钟，如 0,360,10。留空表示未设置
output_fh=
# 时间插值。预设 slinear
interp_method=slinear
# 输入路径模板、起报时间。留空表示未设置
input_fmt=
time=
# 以下留空表示不做对应步骤
output_fmt=
uv_fmt=
# 累计差分间隔；单位与 is_min 一致（false=小时，true=分钟），不必等于 output_fh 步长
delta=
# 读数时时效 0 是否不读文件、改用全 0。预设 false
is_fill0=false
# 输出时效是否按分钟。预设 false。为 true 时 input_fh 仍是小时，output_fh 按分钟
is_min=false
# dtime 沿预报时效，time 沿起报时间。预设 dtime
index=dtime
