# 预报时效拆分运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行，例如：python -m cli.timesplit_hourtomin_plugin_cli
# 路径、起报时间和时效列表留空时必须由命令行传入。

[cli]
# timesplit / hourtomin / read。预设 timesplit
module=timesplit

[timesplit]
# 输入时效 start,stop,step，含 stop，如 0,72,3。留空表示未设置
input_fh=
# 输出时效 start,stop,step，含 stop，如 0,72,1。留空表示未设置
output_fh=
# 时间插值。预设 slinear
interp_method=slinear
# 输入路径模板、起报时间。留空表示未设置
input_fmt=
time=
# 以下留空表示不做对应步骤
output_fmt=
uv_fmt=
delta_hour=
# 缺测是否填 0。预设 false
is_fill0=false

[hourtomin]
# 插值后的时间间隔。预设 10
ntime=10
# true 表示单位为分钟。预设 true
is_min=true
# dtime 或 time。预设 dtime
index=dtime
# 时间插值。预设 slinear
interp_method=slinear

[read]
# 路径模板、时间列表、经纬度范围。留空表示未设置
file_path=
file_time=
glon=
glat=
