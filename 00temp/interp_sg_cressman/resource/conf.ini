# Cressman 站点→格点 运行配置（相对仓库根的路径）
log_file=log/YYYYMMDD.txt

# 输入 / 输出
sta_path=
background_path=
grid_template_path=
output_path=resource/output/cressman.m4

# 读写格式：站点 m3/nc；背景/模板 m4/nc
sta_type=m3
background_type=m4
grid_template_type=m4

# reprocess=false：km 核，r_list 为米；true：再处理，r_list 为度且须 background_path
reprocess=false
# 半径留空则按 reprocess 选默认（km：60000,40000,20000；度：1.0,0.8,0.6,0.4）
r_list=
nearNum=100
outer_value=0
# 再处理标定（仅 reprocess=true）
rain_limit=
degree_blend=0.85
r_km_scale=1.35
innov_gain=1.0
residual_degree_polish=true

# 目标网格（三选一优先级）：glon+glat > domain > background/grid_template
# glon=slon,elon,dlon
# glat=slat,elat,dlat
glon=
glat=
# domain=sou,nor,wst,est,dlon,dlat
domain=
