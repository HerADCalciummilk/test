# Cressman 站点→格点 运行配置（相对仓库根的路径）
log_file=log/YYYYMMDD.txt

# 输入 / 输出
sta_path=
background_path=
grid_template_path=
output_path=resource/output/cressman.m4

# 读写格式：站点 m3/nc；背景/模板 m4/nc
sta_type=m3
background_type=m4
grid_template_type=m4

# Cressman 参数（半径单位：米，与 lon_lat_to_cartesian 一致）
r_list=60000,40000,20000
nearNum=100
# 背景场双线性越界填充；空表示不设（目标域超出背景时需赋值）
outer_value=0

# 目标网格（三选一优先级）：glon+glat > domain > background/grid_template
# glon=slon,elon,dlon
# glat=slat,elat,dlat
glon=
glat=
# domain=sou,nor,wst,est,dlon,dlat
domain=
