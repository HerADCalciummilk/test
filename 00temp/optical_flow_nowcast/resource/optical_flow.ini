# 临近光流外推运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行，例如：
#   python -m cli.lk_plugin_cli --precip obs1.nc,obs2.nc
# 降水场、平流场路径和外推时次留空时必须由命令行传入。
# 字典参数（lk_kwargs、extrap_kwargs 等）和 callback 不在本文件里，仍用插件代码默认值。

[lk]
# 降水场路径，多个用逗号分隔。留空表示未设置
precip=
# 降水强度变换：db、box、NQ、sqrt。留空表示不变换。预设空
transform_method=
# 特征检测。预设 shitomasi
fd_method=shitomasi
# 稀疏矢量插值。预设 idwinterp2d
interp_method=idwinterp2d
# 是否输出稠密速度场。预设 true
dense=true
# 离群剔除的标准差倍数。预设 3
nr_std_outlier=3
# 局部离群检测的近邻数。预设 30
k_outlier=30
# 形态学开运算核大小，0 表示不做。预设 3
size_opening=3
# 稀疏矢量抽稀尺度（像素）。预设 20
decl_scale=20
# 是否打印过程信息。预设 false
verbose=false

[extrapolation]
precip=
# 平流速度场路径。留空表示未设置
velocity=
# 外推时次数。留空表示未设置
timesteps=
# 实况间隔，分钟。预设 10
delta_min=10
# 外推方法。预设 semilagrangian
extrap_method=semilagrangian
# 是否统计耗时。预设 false
measure_time=false

[sprog]
precip=
velocity=
timesteps=
delta_min=10
# 最小可辨降水阈值。预设 -5
precip_thr=-5
# 级联层数。预设 6
n_cascade_levels=6
extrap_method=semilagrangian
# 级联分解。预设 fft
decomp_method=fft
# 带通滤波。预设 gaussian
bandpass_filter_method=gaussian
# 自回归阶数。预设 2
ar_order=2
# 是否只统计超过阈值的格点。预设 false
conditional=false
# 概率匹配。预设 cdf
probmatching_method=cdf
# 并行 worker 数。预设 1
num_workers=1
# FFT 实现。预设 numpy
fft_method=numpy
# spatial 或 spectral。预设 spatial
domain=spatial
measure_time=false

[linda]
precip=
velocity=
timesteps=
delta_min=10
# 是否加扰动得到集合。预设 false
add_perturbations=false
# 特征检测。预设 blob
feature_method=blob
# 最多保留的特征数。预设 25
max_num_features=25
# ARI 阶数。预设 1
ari_order=1
# 核类型。预设 anisotropic
kernel_type=anisotropic
# 以下三项留空表示由场尺寸决定
localization_window_radius=
errdist_window_radius=
acf_window_radius=
extrap_method=semilagrangian
# 扰动参数估计阈值，两个数。预设 0.5,1.0
pert_thrs=0.5,1.0
# 集合成员数。预设 10
n_ens_members=10
# 平流扰动。预设 bps；留空表示不扰动
vel_pert_method=bps
# 空间分辨率（千米/像素）和速度场时间步（分钟）。留空表示未设置
kmperpixel=
timestep=
num_workers=1
# 随机种子。留空表示未设置
seed=
# 是否用多进程。预设 false
use_multiprocessing=false
measure_time=false
# 是否返回预报场。预设 true
return_output=true

[steps]
precip=
velocity=
timesteps=
delta_min=10
# 集合成员数。预设 4
n_ens_members=4
n_cascade_levels=6
# 最小可辨降水阈值。留空表示未设置
precip_thr=
kmperpixel=
timestep=
extrap_method=semilagrangian
decomp_method=fft
bandpass_filter_method=gaussian
# 降水扰动噪声。预设 nonparametric；留空表示不加噪声
noise_method=nonparametric
# 噪声标准差订正：auto、fixed。留空表示不做
noise_stddev_adj=
ar_order=2
# 平流扰动。留空表示不扰动
vel_pert_method=
conditional=false
probmatching_method=cdf
# 无降水掩膜：obs、sprog、incremental。留空表示不掩膜
mask_method=
seed=
num_workers=1
fft_method=numpy
domain=spatial
measure_time=false
return_output=true
