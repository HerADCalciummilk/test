# 降水强度变换运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli.dB_trans_cli

[cli]
# summary / db / box / nq / sqrt。预设 summary
method=summary

[transform]
# 逗号分隔的降水强度。留空表示未设置；除 summary 外必须给出
values=
# 有雨阈值，毫米/小时。db、box 使用。预设 0.1
threshold=0.1
# 无降水格点取值。留空则由对应变换自己决定
zerovalue=
# Box-Cox 的 Lambda。入口参数名是 lam。预设 0。旧键 lambda 仍可读。
lam=0
# 正态分位数变换的绘图位置偏移。预设 0
a=0
# 是否做逆变换。预设 false
inverse=false
