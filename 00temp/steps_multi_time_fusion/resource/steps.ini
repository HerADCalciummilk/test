# STEPS 多时效融合运行配置
# 编码 UTF-8。# 开头为注释。路径相对本包根目录，也可写绝对路径。
#
# 取值优先级（三条 CLI 相同）：
#   1. 命令行显式传入
#   2. 本文件对应节中的非空项
#   3. 代码预设默认值（见各项注释中的「预设」）

[cli]
# 要运行的模块：noise、climatological_skill（可写 skill）、blending。留空则必须传 --module
module=

[noise]
# 当前命令行只支持 generate。预设 generate
mode=generate
# 起报时间标识，如 202508191600。留空则必须由命令行传入
issue_time=
# 滤波器和噪声输出目录。留空则预设 resource/output/noise
output_dir=resource/output/noise
# 级联层数。预设 6
n_levels=6
# AR(2) 系数。预设 0.9 / -0.15
phi1=0.9
phi2=-0.15
# 集合成员数、时间步。预设 5 / 18
n_ens_members=5
timesteps=18

[climatological_skill]
# daily_skill_*.npy 所在目录。留空则必须由命令行传入
input_dir=
# 汇总结果路径。留空则预设 resource/output/climatological_skill.npy
output=resource/output/climatological_skill.npy

[blending]
# 二维降水 npy。留空则必须由命令行传入
nowcast=
nwp=
# 融合结果路径。留空则预设 resource/output/blended.npy
output=resource/output/blended.npy
# 10 分钟步长索引，1 表示 +10min。预设 1
lead_index=1
# 级联层数。预设 8
n_cascade_levels=8
# 技能衰减时间尺度（分钟）。预设 90
tau_min=90.0
# 气候态 skill 的 npy。留空表示不使用
clim_skill=
