# 福建 OTS 降水订正
# 编码 UTF-8。# 开头为注释。空值表示未设置。
#
# 取值优先级：调用参数 > 本文件非空项 > 代码预设
#
# task：threshold 只做阈值表；forecast 只做格点订正；both 先表后订正。预设 forecast
# 在本包目录：python -m cli
# 在 00temp：python -m ots_fzmos_rain task=forecast initial_time=2026090108

[process]
task=forecast
# 大于 1 时，插件内部对 20 个时效并行。预设 1
pro_count=1

# 10 位 YYYYMMDDHH。留空则按运行时刻和 input_time_zone 自动选 08/20（CST）或 00/12（UTC）
now=
initial_time=
input_time_zone=CST
output_time_zone=CST

# --- 格点订正。路径模板里的 FFF 会换成三位时效 012…240 ---
input_rain12_dir=
input_apcp_dir=
input_apcp_time_zone=CST
nc_reader=meteva
nc_writer=meteva
threshold_file=
output_rain12_m4_dir=
output_rain24_m4_dir=
output_rain12_nc_dir=
output_rain24_nc_dir=

# 源网格。纬度递减，与原 Fortran 场一致。预设即下列数值
source_lat_start=55.0
source_lon_start=70.0
source_lat_end=15.0
source_lon_end=140.0
source_dlat=-0.125
source_dlon=0.125
source_num_x=561
source_num_y=321

# 福建业务网格
output_lat_start=21.0
output_lon_start=114.0
output_lat_end=29.0
output_lon_end=127.0
output_dlat=0.025
output_dlon=0.025
output_num_x=521
output_num_y=321
interpolation_radius=0.7

# --- 阈值表。相对路径按本包目录解析 ---
obs_dir=
ec_dir=
station_file=resource/fjstation70-2021.txt
station_count=70
output_file=
