# 地形精细化插值
# 编码 UTF-8。# 开头为注释。空值表示未设置。
#
# 取值优先级：调用参数 > 指定 ini > 本文件非空项 > 代码预设
#
# 在本包目录：python -m cli
# 在 00temp：python -m orographic_nwp_3d_downscaling begin_date=2026111813 operation=i debug=1 update=1
#
# 要素、时效范围、并行和 NetCDF 开关仍在 para_file 指向的 ini，不在本文件。

[process]
debug=0
update=0
# 大于 1 时打开时效并行，进程数用这个值。预设 1
pro_count=1
# i 插值，p 求参，ip 两者
operation=i
# 10 位北京时 YYYYMMDDHH。留空则用运行时刻
begin_date=
resolution=5km
para_file=Fast_refine_interp_5km.ini
# 留空则用本包 resource 与包根
work_dir=
model_region=EC_12P5KM
root_path=
s3_method=g_interp
site_name=Station1
