# 多风场 FFT 融合（wind_fft_blending）
# 编码 UTF-8。# 开头为注释。路径相对本包根目录，也可写绝对路径。
# 多个路径或前缀用英文逗号分隔。
#
# 取值优先级（process / python -m cli）：
#   1. 调用时显式传入
#   2. 本文件中的非空项
#   3. 代码预设默认值（见各项注释中的「预设」）

# ---------- 输入输出（每次任务通常要改；留空则必须由调用方传入）----------
# 主风场 Micaps11。多任务时与 ass_uv_path、output_prefix 等长、一一对应。
# 旧键 main_uv 仍可读。
main_uv_path=
# 辅助风场。单主场时可逗号分隔多个辅助场；多主场时与主场等长。
# 旧键 ass_uv 仍可读。
ass_uv_path=
# 输出目录。留空则预设 resource/output
output_dir=resource/output
# 输出文件名前缀。留空则预设 fft_merge
output_prefix=fft_merge

# ---------- 可调运行参数（可作为常量放在这里；不传则读本段）----------
# 特征匹配网格边长。预设 128
# 直接调用 FFTMergePlugin 且不传该参数时，类签名默认仍是 192
feature_border=128
# 位移求解最大迭代次数。预设 1024
max_iterations=1024
# 主场向辅助场移动比例，范围 (0, 1]。预设 1.0
move_percent=1.0
# 是否另存线性平均对比结果。预设 true
write_linear_compare=true
# 多任务时是否多进程。预设 false
is_multi=false
# 多进程并行数，仅 is_multi=true 时使用。预设 4
pro_count=4

# ---------- 算法常量（也是 process / CLI 参数；不传则读这里，再没有用预设）----------
# 频域 Tikhonov 约束权重。预设 0.1
weight_value=0.1
# 平滑滤波幂律指数，取 2 或 4。预设 2
power_model=2
# FFT 谱域尺度比率。预设 1
l_scale=1
# 平流与迭代时的反射边界像素。预设 25
reflect_pad=25
