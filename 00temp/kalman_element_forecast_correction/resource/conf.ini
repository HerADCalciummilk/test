# Kalman 要素订正运行配置
# 编码 UTF-8。# 开头为注释。路径可写绝对路径。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件对应节中的非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli --module kalman

[cli]
# 要运行的模块：kalman（订正）、trans（拷贝源数据）。留空则必须传 --module
module=

[kalman]
# 开始/结束日期 YYYYMMDD。留空则预设为前一天，结束日期默认等于开始日期
start_date=
end_date=
# Kalman 产品根目录。预设 /data234/GUO_data/Kalman_data
base_dir=/data234/GUO_data/Kalman_data
# CLDAS 实况根目录
obs_root=/data234/DataPool/01CLDAS/00HRCLDAS/Hourly
# 误差更新系数。预设 0.15
alpha=0.15
# 向前回溯天数。预设 5
back_days=5
# 逗号分隔变量。预设 SWVL,STL
variables=SWVL,STL
# 最新可用观测时间 YYYYMMDDHH。留空表示不限制
obs_end_time=

[trans]
# 拷贝日期 YYYYMMDD。留空则预设为前一天
date=
swvl_source=/data/mnt/model_RT/globalECMWF_D1D/SWVL
stl_source=/data/mnt/model_RT/globalECMWF_D1D/STL
target_base=/data234/GUO_data/Kalman_data/process_data
