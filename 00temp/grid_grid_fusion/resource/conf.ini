# 格点→格点融合运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli
# grid 留空时必须由命令行传入；目标网格须给 glon+glat / domain / grid_template 之一。

[cli]
# linear / nearest / cubic。预设 linear
module=linear

[input]
grid=
# 可选网格模板（仅取水平网格）
grid_template=

[output]
# 可选；给出则写 Micaps4。留空仅打印结果
path=

[linear]
# 插值坐标。当前仅支持 xy。预设 xy
used_coords=xy
# 目标超出源网格时的填充值。预设 0
outer_value=0

[nearest]
used_coords=xy
outer_value=0

[cubic]
used_coords=xy
outer_value=0

[target]
# glon=slon,elon,dlon
glon=
# glat=slat,elat,dlat
glat=
# domain=sou,nor,wst,est,dlon,dlat（与 glon/glat 二选一）
domain=
