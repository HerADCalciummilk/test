# 默认运行配置。留空的项沿用入口函数现有默认值，不改变算法结果。
# 外部配置：process(..., config="其他.ini")，相对路径按本包目录解析。

[process]
refl_path=
kdp_path=
att_path=
hydro_path=
kdp_alpha=
kdp_beta=
a_alpha=
a_beta=
rr_field=
main_field=
thresh=
thresh_max=
output_path=

# 极坐标质控 CLI（cli/radar_qc_cli.py）。
# 仅填补 process 里仍为 None 的路径项；有方法默认值的参数留空即可。
# 给定 dem_path 则做波束遮挡。
[radar_qc]
input_path=
dem_path=
refl_output_path=
kdp_output_path=
att_output_path=

# 基数据→经纬网格附属 CLI（cli/radar_grid_cli.py；cli/standard_data 轻量读入）
# 仅填补 process 里仍为 None 的路径/产品项。
[radar_grid]
input_path=
output_dir=
fields=
