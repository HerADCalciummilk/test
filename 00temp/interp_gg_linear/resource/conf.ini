# 格点→格点双线性插值 运行配置（相对仓库根的路径）
log_file=log/YYYYMMDD.txt

# 输入 / 输出
grid_path=
grid_template_path=
output_path=resource/output/gg_linear.m4

# 读写格式：源格点 / 模板 m4/nc
grid_type=m4
grid_template_type=m4

# 插值参数（当前仅支持 used_coords=xy）
used_coords=xy
# 目标超出源网格时必须赋值；空表示不设
outer_value=0

# 目标网格（二选一优先级）：glon+glat > domain > grid_template
# glon=slon,elon,dlon
# glat=slat,elat,dlat
glon=
glat=
# domain=sou,nor,wst,est,dlon,dlat
domain=
