# 阵风系数（gust_factor）运行配置
# 路径相对本包仓库根；空值表示该项由 CLI 覆盖或可选

log_file=log/YYYYMMDD.txt

# 运行模式：calc=仅算系数；correct=仅订正；all=先算系数再订正
mode=all

# —— 系数计算 ——
# 历史站点 CSV 目录（列：level,time,dtime,id,lon,lat,fcst_wind,obs_gust）
station_csv_dir=resource/test_data
# 预报时效列表（小时）
fore_hours=24,48,72
# 阵风系数 JSON 输出/输入路径
factor_path=resource/output/gust_factor.json

# —— 阵风订正 ——
u_path=resource/sample/UTC_20260505000000_WIU10_024.nc
v_path=resource/sample/UTC_20260505000000_WIV10_024.nc
# 订正所用预报时效（须在 factor json 中存在）
fore_hour=24
# 订正后阵风格点输出（nc）
output_path=resource/output/UTC_20260505000000_10FG_024.nc

# —— 可选对比图 ——
make_png=true
show_png=false
ws_path=resource/sample/UTC_20260505000000_WS10_024.nc
png_path=resource/output/WS_and_GUST.png
