# 格点→站点插值运行配置
# 编码 UTF-8。# 开头为注释。
#
# 参数优先级（高 → 低）：
#   1. 命令行 key=value 或 Python process(...) 显式传入
#   2. config= 指定的输入配置文件中的非空项
#   3. 本文件非空项
#   4. process 签名预设默认值
#
# 键名与 cli/interpolation_grid_station_cli.py 中 process 形参一一对应。
# 在 00temp 目录执行：python -m interpolation_grid_station method=linear grid=... sta=...
# 或在包目录执行：python -m cli method=linear grid=... sta=...
# grid / sta 必填。

[cli]
# linear / nearest / cubic。预设 linear
method=linear

[input]
grid=
sta=
# 源格点格式：nc 或 m4。留空则按扩展名（.nc→nc，否则 m4）
grid_type=
# 站点格式：csv 或 m3。留空则按扩展名（.csv→csv，否则 m3）
sta_type=

[output]
# 可选；给出则写站点文件（csv/m3）。留空仅打印结果
output=
# 输出格式：csv 或 m3。留空则按 output 扩展名
output_type=

[params]
# 仅 linear：xy / xyz / xydt。预设 xy（其它 method 忽略）
used_coords=xy
