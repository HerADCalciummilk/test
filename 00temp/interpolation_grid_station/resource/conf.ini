# 格点→站点插值运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli
# grid / sta 留空时必须由命令行传入。

[cli]
# linear / nearest / cubic。预设 linear
module=linear

[input]
grid=
sta=
# 源格点格式：nc 或 m4。留空则按扩展名（.nc→nc，否则 m4）
grid_type=
# 站点格式：csv 或 m3。留空则按扩展名（.csv→csv，否则 m3）
sta_type=

[output]
# 可选；给出则写站点文件（csv/m3）。留空仅打印结果
path=
# 输出格式：csv 或 m3。留空则按 path 扩展名
type=

[linear]
# xy / xyz / xydt。预设 xy（仅 linear）
used_coords=xy
