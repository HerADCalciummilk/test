# 格站融合运行配置（相对仓库根的路径）
log_file=log/YYYYMMDD.txt

# 输入 / 输出（请按环境修改）
grid_path=
sta_path=
output_path=resource/output/merge.m4
terr_path=

# 读写格式：m4/nc ；站点 m3/nc
grid_type=m4
sta_type=m3

# 融合参数
R=200
# domain=sou,nor,wst,est,dlon,dlat ；空则从格点推断
domain=
use_heatflux=false
hf_eq_iter_nums=20

# 站点列名（Micaps3 常用 data0）
sta_val_col=data0
sta_lon_col=lon
sta_lat_col=lat
