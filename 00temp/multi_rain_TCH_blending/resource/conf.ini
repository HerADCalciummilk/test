# TCH 多模式集成 24 小时降水（pre_fcst_tch_realtime）
# 编码 UTF-8。# 开头为注释。路径相对本包根目录，也可写绝对路径。
#
# 取值优先级（process / python -m cli）：
#   1. 调用时显式传入
#   2. 本文件中的非空项
#   3. 代码预设（与下面各项当前取值一致）

# 0.1° 全国掩膜。-1 表示掩膜外
maskout_file=resource/maskout_cn_0.1_2.dat
nx_mask=701
ny_mask=601

# 模式降水输入目录与 TCH 输出目录。目录末尾保留斜杠
dir_model_data=//10.28.16.234/data1/nimm_test_data_tmp/multi_rain_TCH_blending/test_data
dir_tch_output=//10.28.16.234/data1/nimm_test_data_tmp/multi_rain_TCH_blending/test_data/tch/sfc/

# 模式降水输入格式：nc（默认，read_griddata_from_nc）或 m4（micaps4）
ipt_type=nc

# 参与集成的模式，顺序决定权重与输出分量的对应关系
model_list=ecmwf,german_gfs_hr,ncep_gfs_hr,grapes_3km,beijing_mr,guangzhou_mr,shanghai_mr

# 统一插值网格：起始,终止,分辨率
grid_lon=70,140.0,0.10
grid_lat=0.0,60.0,0.10

# 预报时效（小时），24 小时累积降水
fcst_hours=36,60,84

# 站点层次、北京时与 UTC 的时差（小时）
station_level=600
bjt_offset_hours=8

# 当前北京时 >= 阈值取当日 late 时（UTC 00 = 北京时 08），否则取前一日 early 时（UTC 12 = 北京时 20）
initial_hour_threshold=12
initial_hour_late=0
initial_hour_early=12

# 用该时刻代替“现在”再做上面的时次判定。格式 YYYYMMDDHHMMSS。留空表示用当前时间
initial_time=20260524000000
