# 坐标投影转换运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli
# 或在 00temp 目录：python -m coordinate_projection_transform
# 选 iris：backend=iris

[cli]
# lonlat-to-equal / equal-to-lonlat。预设 lonlat-to-equal
mode=lonlat-to-equal
# cartopy / iris。预设 cartopy
backend=cartopy
# 输入 Cube 路径（.nc 等）。须显式给出或在此填写
# source_cube=

[lonlat_to_equal]
# 目标范围 lonmin,lonmax,latmin,latmax。预设 83,138,12,53
projection_extent=83,138,12,53
# Lambert 割线纬度。预设 25,47
secant_latitudes=25,47
# 等距格距，米。预设 1000
grid_distance=1000
# bilinear 或 nearest。预设 bilinear
regrid_mode=bilinear
# 域外填充。预设 nanmask
extrapolation_mode=nanmask

[equal_to_lonlat]
# 目标等经纬度范围 lonmin,lonmax,latmin,latmax。预设同 projection_extent
lonlat_extent=83,138,12,53
# 等经纬度格距，度。预设 0.1
grid_spacing=0.1
# bilinear 或 nearest。预设 bilinear
regrid_mode=bilinear
# 域外填充。预设 nanmask
extrapolation_mode=nanmask
