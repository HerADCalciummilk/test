# 坐标投影转换运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli

[cli]
# summary / lonlat-to-equal / meteva-to-cube / cube-to-meteva。预设 summary
mode=summary

[lonlat_to_equal]
# 目标范围 lonmin,lonmax,latmin,latmax。预设 83,138,12,53
projection_extent=83,138,12,53
# Lambert 割线纬度。预设 25,47
secant_latitudes=25,47
# 等距格距，米。预设 1000
grid_distance=1000
# bilinear 或 nearest。预设 bilinear
regrid_mode=bilinear
# 域外填充。预设 nanmask
extrapolation_mode=nanmask

[meteva_to_cube]
# latlon 或 equalarea。预设 latlon
spatial_grid=latlon
# 要素时间界，如 -1,0。留空表示不设
bounds=

[kdtree]
# 最邻近点数。预设 3
near_num=3
# 最邻近搜索距离，米。预设 20000
near_distance=20000
