# 兼容旧名：内容与 conf.ini 对齐；运行时默认读 conf.ini。
# 若需改用本文件，显式传 config=resource/projection.ini

[cli]
mode=lonlat-to-equal

[lonlat_to_equal]
projection_extent=83,138,12,53
secant_latitudes=25,47
grid_distance=1000
regrid_mode=bilinear
extrapolation_mode=nanmask

[equal_to_lonlat]
lonlat_extent=83,138,12,53
grid_spacing=0.1
regrid_mode=bilinear
extrapolation_mode=nanmask
