# 网格站点融合运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli
# sta 必填；grid 与 background 至少其一；reprocess=true / idw_delta 须 background。

[cli]
# idw / idw_delta / gaussian / kriging / cressman（total 为 idw 旧别名）。预设 idw
module=idw
# 是否偏差/创新量路径。预设 false；true / idw_delta 时须 background
# idw 在 reprocess=true 且未显式设 gaussian 时，默认 IDW×高斯
reprocess=false

[input]
sta=
grid=
# 可选背景场 nc/m4。可与 grid 二选一以提供网格；reprocess=true 时必需
background=
# 站点格式：csv 或 m3。留空则按扩展名（.csv→csv，否则 m3）
sta_type=
# 格点 / 背景格式：nc 或 m4。留空则按扩展名（.nc→nc，否则 m4）
grid_type=
background_type=

[output]
# 可选；给出则写格点 nc/m4。留空仅打印结果
path=
# 输出格式：nc 或 m4。留空则按 path 扩展名
type=

[idw]
# 影响半径（纯 IDW 硬截断；高斯权重时为高斯尺度）。预设 1000
effect_r=1000
# 最邻近站点数。预设 8
near_num=8
# 距离衰减指数。预设 2
decrease=2
# 是否乘高斯核。留空：reprocess=false→false，reprocess=true→true；显式 true/false 覆盖
gaussian=

[idw_delta]
# 历史模块名：InterpSgIdw(gaussian=True, reprocess=True)；须 background
# 数值参数回退读 [idw]（effect_r / near_num / decrease）
effect_r=
near_num=
decrease=

[gaussian]
# 高斯半径。预设 20
half_r=20

[kriging]
# 变异函数：spherical / exponential / gaussian。预设 spherical
model=spherical
# 近邻站点数。预设 20
near_num=20
# 基台值。留空则用站点方差自动估计
sill=
# 变程（与笛卡尔距离同单位，米量级）。留空则自动估计
range=
# 块金值。预设 0
nugget=0

[cressman]
# 影响半径列表（米，逗号分隔）。预设 60000,40000,20000
r_list=60000,40000,20000
# 近邻站点数。预设 100
near_num=100
