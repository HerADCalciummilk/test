# 网格站点融合运行配置
# 编码 UTF-8。# 开头为注释。
#
# 键名与 cli/interpolation_station_grid_cli.py 中 process 的形参一一对应（全局唯一）。
# 取值优先级：
#   1. 命令行 / 调用时显式传入（key=value）
#   2. 输入配置 config=（若指定）
#   3. 本文件非空项
#   4. process 签名上的预设值
#
# 在 00temp 目录执行：python -m interpolation_station_grid method=idw sta=... grid=...
# sta 必填；grid 与 background 至少其一；reprocess=true 须 background。

[cli]
# idw / gaussian / kriging / cressman。预设 idw
method=idw
# 是否偏差/创新量路径（与 idw_gaussian 独立）。预设 false；true 时须 background
reprocess=false
# 背景对齐越界填充值。留空则不传（None）
outer_value=

[input]
sta=
grid=
# 可选背景场 nc/m4。可与 grid 二选一以提供网格；reprocess=true 时必需
background=
# 站点格式：csv 或 m3。留空则按扩展名（.csv→csv，否则 m3）
sta_type=
# 格点 / 背景格式：nc 或 m4。留空则按扩展名（.nc→nc，否则 m4）
grid_type=
background_type=

[output]
# 可选；给出则写格点 nc/m4。留空仅打印结果
output=
# 输出格式：nc 或 m4。留空则按 output 扩展名
output_type=

[idw]
# 影响半径（纯 IDW 硬截断；idw_gaussian=true 时为高斯尺度）。预设 1000
idw_effect_r=1000
# 最邻近站点数。预设 8
idw_near_num=8
# 距离衰减指数。预设 2
idw_decrease=2
# 是否乘高斯核（与 reprocess 独立）。预设 false
idw_gaussian=false

[gaussian]
# 高斯半径。预设 20
gaussian_half_r=20

[kriging]
# 变异函数：spherical / exponential / gaussian。预设 spherical
kriging_model=spherical
# 近邻站点数。预设 20
kriging_near_num=20
# 基台值。留空则用站点方差自动估计
kriging_sill=
# 变程（与笛卡尔距离同单位，千米）。留空则自动估计
kriging_range=
# 块金值。预设 0
kriging_nugget=0

[cressman]
# 影响半径列表（逗号分隔）。留空时由插件按 reprocess 选默认：
#   reprocess=false → 60,40,20（千米）
#   reprocess=true  → 1.0,0.8,0.6,0.4（度）
cressman_r_list=
# 近邻站点数。预设 100
cressman_near_num=100

# 以下 cressman_* 仅在 method=cressman 且 reprocess=true（度制创新量路径）时生效，其它情况忽略。
# 降水回退阈值：结果 ≤ 该值的格点回退（步内回退到该步之前的场值，结束时回退到背景场）。
# 留空不回退；rain24 原版调用用 0.01
cressman_rain_limit=
# 站点数下限：格点影响圈内至少有几个站才更新（度制步）。预设 1.0
cressman_num_limit=1.0
# 度制幂权重 1/(d+smooth)^power_param 的平滑项（度制步）。预设 0.001
cressman_smooth=0.001
# 度制幂权重的幂次（度制步）。预设 2.0
cressman_power_param=2.0
# 度制半径换成千米半径时的缩放（仅千米核创新量扫；degree_blend=1.0 时不用）。预设 1.35
cressman_r_km_scale=1.35
# 创新量增益（仅千米核创新量扫；degree_blend=1.0 时不用）。预设 1.0
cressman_innov_gain=1.0
# 追加创新量再扫次数，每次用最小的两级半径（degree_blend=1.0 时不用）。预设 0
cressman_residual_passes=0
# 创新量扫之后是否做度制抛光（degree_blend=1.0 时不用）。预设 true
cressman_residual_degree_polish=true
# 度制抛光轮数（degree_blend=1.0 时不用）。预设 1
cressman_residual_polish_rounds=1
# 创新量扫结果与纯度制 GressMan 结果的融合权重，范围 [0,1]：
#   1.0 = 纯度制（rain24 original，上面几项千米核相关参数都不起作用）；0 = 不融合；预设 0.85（rain24 aligned）
cressman_degree_blend=0.85
# 站点锚定半径（度，经纬度平面距离）。预设 0.35
cressman_station_anchor_radius=0.35
# 站点锚定强度，范围 [0,1]：把站点周围格点向观测值局部拉近。预设 0.0（不锚定）
cressman_station_anchor_strength=0.0
