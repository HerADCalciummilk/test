# process 的参数。没有显性传入时读取这里。
# 默认 aligned=现版（原版 OF 估 UV + 项目 Cressman 再处理 + Extrapolation）；
# original=原版 GressMan+Lagrangian（可 match_mode=original 或改用 conf.ini 旧配置习惯）
match_mode=aligned
# 相对本包根目录（不要写 ../，否则在包根执行 python -m cli 会指到 00temp/resource）
# 现版默认用 aligned 插件路径；跑原版时可改回 resource/ecmwf.json
plugin=resource/ecmwf_aligned.json
pro_count=4
rpt_times=2026081200,2026081312

station_info=resource/sta.m3
mask_nc=resource/mask010.nc

ipt_model=0
ipt_obs=1
ipt_type=m4
opt_type=m4
over_w=0

start_dtime=36
end_dtime=252
inter_dtime1=12
inter_dtime2=12
report_inter=12

res=0.1
clip_coords=70.0,140.0,0.0,60.0


