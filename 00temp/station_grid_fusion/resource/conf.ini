# 网格站点融合运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli
# sta、grid 留空时必须由命令行传入，不会猜测路径。

[cli]
# total / idw / idw_delta / gaussian。预设 total
module=total

[input]
sta=
grid=
# 仅 total：背景场 nc。留空表示不做偏差订正
background=

[idw]
# 影响半径。预设 1000
effect_r=1000
# 最邻近站点数。预设 8
near_num=8
# 距离衰减指数。预设 2
decrease=2

[idw_delta]
effect_r=1000
near_num=8
decrease=2

[gaussian]
# 高斯半径。预设 20
half_r=20

[total]
# 无背景场时的反距离参数。预设 1000 / 8 / 2
effect_r=1000
near_num=8
decrease=2
# 有背景场时的偏差扩散参数。预设 400 / 10 / 2
delta_effect_r=400
delta_near_num=10
delta_decrease=2
