# 网格站点融合运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli
# sta、grid 留空时必须由命令行传入，不会猜测路径。

[cli]
# idw / idw_delta / gaussian / kriging / cressman（total 为 idw 旧别名）。预设 idw
module=idw

[input]
sta=
grid=
# 可选背景场 nc。idw/kriging/gaussian：偏差订正；cressman：初估场
background=

[idw]
# 影响半径（无背景时硬截断；有背景时作高斯半径）。预设 1000
effect_r=1000
# 最邻近站点数。预设 8
near_num=8
# 距离衰减指数。预设 2
decrease=2

[idw_delta]
# 兼容旧模块名：InterpSgIdw(gaussian=True)，--grid 作背景场
effect_r=1000
near_num=8
decrease=2

[gaussian]
# 高斯半径。预设 20
half_r=20

[kriging]
# 变异函数：spherical / exponential / gaussian。预设 spherical
model=spherical
# 近邻站点数。预设 20
near_num=20
# 基台值。留空则用站点方差自动估计
sill=
# 变程（与笛卡尔距离同单位，米量级）。留空则自动估计
range=
# 块金值。预设 0
nugget=0

[cressman]
# 影响半径列表（米，逗号分隔）。预设 60000,40000,20000
r_list=60000,40000,20000
# 近邻站点数。预设 100
near_num=100
