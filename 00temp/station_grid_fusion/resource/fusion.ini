# 网格站点融合运行配置（旧文件名；请优先使用 conf.ini）
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli
# sta、grid 留空时必须由命令行传入，不会猜测路径。

[cli]
# idw / idw_delta / gaussian / kriging / cressman（total 为 idw 旧别名）。预设 idw
module=idw

[input]
sta=
grid=
# 可选背景场 nc。idw/kriging/gaussian：偏差订正；cressman：逐步订正初估场
background=

[idw]
effect_r=1000
near_num=8
decrease=2

[idw_delta]
# 兼容旧模块名：InterpSgIdw(gaussian=True)，--grid 作背景场
effect_r=1000
near_num=8
decrease=2

[gaussian]
half_r=20

[cressman]
r_list=60000,40000,20000
near_num=100
