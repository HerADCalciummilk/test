# 格点→格点融合运行配置
# 编码 UTF-8。# 开头为注释。
#
# 参数优先级（高 → 低）：
#   1. 命令行 key=value 或 Python process(...) 显式传入
#   2. config= 指定的输入配置文件中的非空项
#   3. 本文件非空项
#   4. process 签名预设默认值
#
# 键名与 cli/interpolation_grid_grid_cli.py 中 process 形参一一对应。
# 在 00temp 目录执行：python -m interpolation_grid_grid method=linear grid=... domain=...
# 或在包目录执行：python -m cli method=linear grid=... domain=...
# grid 必填；目标网格须给 glon+glat / domain / grid_template 之一。

[cli]
# linear / nearest / cubic / conservative。预设 linear
method=linear

[input]
grid=
# 可选网格模板（仅取水平网格）
grid_template=
# 源格点 / 模板格式：nc 或 m4。留空则按扩展名（.nc→nc，否则 m4）
grid_type=
grid_template_type=

[output]
# 可选；给出则写 Micaps4。留空仅打印结果
output=

[params]
# 目标超出源网格时的填充值。预设 0
outer_value=0
# 仅 conservative：缺测/覆盖容差 [0, 1]，语义同 Iris AreaWeighted。预设 1
mdtol=1
# 仅 conservative：是否按球面面积因子（sin(lat)）。预设 true
spherical=true

[target]
# glon=slon,elon,dlon
glon=
# glat=slat,elat,dlat
glat=
# domain=sou,nor,wst,est,dlon,dlat（与 glon/glat 二选一）
domain=
