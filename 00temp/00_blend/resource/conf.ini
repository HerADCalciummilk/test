# 权重融合运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli.weight_blending_cli
# 预报场和评分场是 iris Cube，由 Python 调用 process 传入，不在这里猜路径。

[blend]
# 评分换成权重的指数。预设 -2，即权重 = 评分 ** -2
weight_power=-2
# 是否容忍预报时效不一致。预设 false。当前 process 尚未使用该项
tolerate_period_mismatch=false
