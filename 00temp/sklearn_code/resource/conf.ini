# sklearn_code：单模型训练 / 预测
# 编码 UTF-8。取值优先级：显式参数 > 本文件非空项 > process 签名预设。

# 训练 / 预测 CSV（须含站点维度列与特征列；训练另含目标列）
train_path=resource/data/train_data.txt
predict_path=resource/data/predict_data.txt
model_save_path=resource/model/model.pkl
output_path=resource/prediction/prediction.txt

# 特征列（逗号分隔）与目标列
feature_cols=TEM,PRE_1h,PRE_3h,PRE_6h
target_col=TEM

# 输出预测列名
data_name=TEM_pred

# 算法名：linear / random_forest / bayesian / logistic / …；特征工程：pca / standard_scaler，空表示不用
model=linear
feat_model=

# 超参数 JSON 对象，如 {"n_estimators":50}；空表示 {}
model_kwargs=
feat_kwargs=

# 为 true 时忽略已有模型，强制重训
retrain=false
