# FY-4B AGRI L1 解码运行配置
# 编码 UTF-8。# 开头为注释。
#
# 取值优先级：
#   1. 命令行显式传入
#   2. 本文件非空项
#   3. 代码预设（见各项注释中的「预设」）
#
# 在本包目录执行：python -m cli
# 输入、输出和时间留空时必须由命令行传入，不会猜测路径。

[cli]
# batch 或 single。预设 batch
module=batch

[grid]
# 目标经纬度分辨率，度。预设 0.04
resolution=0.04
# 纬度范围。预设 -60 到 60
lat_min=-60
lat_max=60
# 相对星下点经度的半宽，度。预设 75
lon_half_width=75
# 通道，如 1-15 或 1,3,7。预设 1-15
channels=1-15
# nearest 或 bilinear。预设 bilinear
resampling=bilinear

[batch]
# 以下四项留空表示未设置，运行前必须在命令行或这里给出
input_root=
output_root=
start_time=
end_time=
# 文件名中的星下点。预设 1050E,1330E
centers=1050E,1330E
# 已存在的 NetCDF 是否覆盖。预设 false
overwrite=false
# 是否递归扫描 HDF。预设 false
recursive=false

[single]
# 留空表示未设置，运行前必须在命令行或这里给出
input_hdf=
output_dir=
