name: 算法优化或修复
description: 说明这一次要完成的优化或修复，并在右侧选择 Milestone。
body:
  - type: markdown
    attributes:
      value: |
        请把 **这一次要完成的工作** 写清楚。具体需求请用下方清单逐条列出。

        填写前请选择 **Milestone**（例如 `v1.3.0`），表示本需求计划进哪一版。若还没有对应版本，请先到 Issues → Milestones 新建，再继续填写。

        标题请概括这次工作的需求，例如「降低夜间误报」或「修复空输入崩溃」。
  - type: dropdown
    id: change_type
    attributes:
      label: 类型
      options:
        - 优化 / 新能力
        - 缺陷修复
        - 文档
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 做完之后应达到什么效果。有数据就写数据，没有就写可观察的现象。
      placeholder: 例如：夜间误报下降；空输入不再崩溃。
    validations:
      required: true
  - type: textarea
    id: items
    attributes:
      label: 本次项
      description: 列出这次要完成的每一项。需要时写上包路径（如 NIMM/02diagnostic/foo）。完成后请在对应项前打勾。
      value: |
        - [ ] 
        - [ ]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收
      description: 怎样判断这些项已经合格，便于完成后核对。
      placeholder: 例如：清单中的项均已落地，关键行为可复现检查。
      value: |
        - [ ]
    validations:
      required: true
