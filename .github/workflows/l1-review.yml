name: L1 review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  l1-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review tools
        run: pip install -r .github/scripts/review/requirements.txt

      - name: Run L1 review
        id: review
        run: |
          set +e
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            python .github/scripts/review/review.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --json review.json
          else
            python .github/scripts/review/review.py --json review.json
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Count prior L1 comments
        if: always() && github.event_name == 'pull_request'
        id: prior
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- nimm-l1-review -->';
            let page = 1;
            let total = 0;
            while (true) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
                page,
              });
              if (!comments.length) break;
              total += comments.filter((c) => c.body && c.body.includes(marker)).length;
              if (comments.length < 100) break;
              page += 1;
              if (page > 20) break;
            }
            const attempt = total + 1;
            core.setOutput('attempt', String(attempt));
            core.info(`Prior L1 comments: ${total}; this attempt: ${attempt}`);

      - name: Render PR comment markdown
        if: always()
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ATTEMPT="${{ steps.prior.outputs.attempt }}"
          if [ -z "$ATTEMPT" ]; then ATTEMPT=1; fi
          python .github/scripts/review/format_comment.py \
            --json review.json \
            --out review-comment.md \
            --sha "${{ github.sha }}" \
            --run-url "$GITHUB_RUN_URL" \
            --attempt "$ATTEMPT"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-review-report-${{ github.run_id }}
          path: |
            review.json
            review-comment.md
          if-no-files-found: warn

      - name: Append review comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-comment.md', 'utf8');
            const { data: created } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.info(`Appended L1 comment ${created.id}`);

      - name: Fail job when blockers exist
        if: steps.review.outputs.exit_code != '0'
        run: |
          echo "L1 存在阻断项，检查失败。详见 PR 评论或 Artifact review.json"
          exit 1
