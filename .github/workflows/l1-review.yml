# L1 机器审核工作流
# 流程：检出 → 安装依赖 → review.py 检查 → 上传 Artifact
#       → 在 PR opened（创建）或 synchronize（新 push）且非 Re-run 时追加评论
#       → 若有 blocker 则 job 失败（红灯）
# 脚本目录：.github/scripts/review/（rules.py 规则 / review.py 检查 / format_comment.py 评论）

name: L1 review

on:
  # 创建或更新 PR 时跑；手动触发不带 --base，通常扫不到包（仅验证 workflow 能跑通）
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # 追加 PR 评论需要

jobs:
  l1-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史以便相对 base.sha 做 diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install review tools
        run: pip install -r .github/scripts/review/requirements.txt

      # 有 blocker 时 review.py 返回非 0；此处先记下 exit_code，保证后续 Artifact 仍执行
      - name: Run L1 review
        id: review
        run: |
          set +e
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            python .github/scripts/review/review.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --json review.json
          else
            python .github/scripts/review/review.py --json review.json
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # 创建 PR（opened）或新 push（synchronize），且非 Re-run 时准备/追加评论
      - name: Count prior L1 comments
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          (github.event.action == 'opened' || github.event.action == 'synchronize') &&
          github.run_attempt == 1
        id: prior
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- nimm-l1-review -->';
            let page = 1;
            let total = 0;
            while (true) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
                page,
              });
              if (!comments.length) break;
              total += comments.filter((c) => c.body && c.body.includes(marker)).length;
              if (comments.length < 100) break;
              page += 1;
              if (page > 20) break;
            }
            const attempt = total + 1;
            core.setOutput('attempt', String(attempt));
            core.info(`Prior L1 comments: ${total}; this attempt: ${attempt}`);

      - name: Render PR comment markdown
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          (github.event.action == 'opened' || github.event.action == 'synchronize') &&
          github.run_attempt == 1
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ATTEMPT="${{ steps.prior.outputs.attempt }}"
          if [ -z "$ATTEMPT" ]; then ATTEMPT=1; fi
          python .github/scripts/review/format_comment.py \
            --json review.json \
            --out review-comment.md \
            --sha "${{ github.sha }}" \
            --run-url "$GITHUB_RUN_URL" \
            --attempt "$ATTEMPT"

      # 每次 run 仍上传 Artifact（含 Re-run），便于下载完整报告
      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-review-report-${{ github.run_id }}
          path: |
            review.json
            review-comment.md
          if-no-files-found: warn

      # opened / synchronize + 首次 attempt 追加评论（Re-run 不刷屏）
      - name: Append review comment on PR
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          (github.event.action == 'opened' || github.event.action == 'synchronize') &&
          github.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review-comment.md', 'utf8');
            const { data: created } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.info(`Appended L1 comment ${created.id}`);

      - name: Fail job when blockers exist
        if: steps.review.outputs.exit_code != '0'
        run: |
          echo "L1 存在阻断项，检查失败。详见 PR 评论或 Artifact review.json"
          exit 1
