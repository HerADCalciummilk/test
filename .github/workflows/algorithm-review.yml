# =============================================================================
# 算法上传审核（统一入口）
# -----------------------------------------------------------------------------
# 维护约定：
#   - 本文件是 CI 唯一入口；不要再拆成并行的 l1-*.yml / l2-*.yml
#   - Job 划分：l1 = 机器门禁；l2 = LLM 语义（仅当 l1 成功后执行）
#   - 脚本目录 .github/scripts/review/：
#       common.py / rules.py
#       l1_review.py + format_l1_comment.py
#       l2_review.py + format_l2_comment.py
#   - 报告命名：l1-review.json / l2-review.json；L2 下载 L1 Artifact 复用摘要
#
# 流程：
#   PR / 手动触发
#     → job l1：静态检查 → Artifact →（条件）PR 评论 → blocker 则失败
#     → job l2：needs l1 且成功 → 下载 l1-review.json → LLM → Artifact →（条件）PR 评论
#
# Secrets（仅 l2）：OPENAI_API_KEY；可选 OPENAI_BASE_URL、OPENAI_MODEL
# 分支保护：在 GitHub Settings 勾选必过的 Checks，不是脚本开关。建议必过 L1；L2 依赖 API Key，一般不要勾成必过。
# Actions 版本：使用 Node 24 兼容大版本，避免 runner 上 Node 16/20 弃用告警
# =============================================================================

name: Algorithm review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# ---------------------------------------------------------------------------
# Job：L1 机器审核
# ---------------------------------------------------------------------------
jobs:
  l1:
    name: L1 machine review
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install review tools
        run: pip install -r .github/scripts/review/requirements.txt

      # blocker 时 l1_review.py 非 0；先记 exit_code，保证后续 Artifact / 评论仍执行
      - name: Run L1 review
        id: review
        run: |
          set +e
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            python .github/scripts/review/l1_review.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --json l1-review.json
          else
            python .github/scripts/review/l1_review.py --json l1-review.json
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render L1 PR comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          (github.event.action == 'opened' || github.event.action == 'synchronize')
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          L2_STATUS=pending
          if [ "${{ steps.review.outputs.exit_code }}" != "0" ]; then
            L2_STATUS=skipped
          fi
          python .github/scripts/review/format_l1_comment.py \
            --json l1-review.json \
            --out l1-review-comment.md \
            --sha "$HEAD_SHA" \
            --run-url "$GITHUB_RUN_URL" \
            --l2-status "$L2_STATUS"

      - name: Upload L1 artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: l1-review-report-${{ github.run_id }}
          path: |
            l1-review.json
            l1-review-comment.md
          if-no-files-found: warn

      - name: Upsert L1 comment on PR
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          (github.event.action == 'opened' || github.event.action == 'synchronize')
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const sha = process.env.HEAD_SHA || '';
            const marker = `<!-- nimm-review-round:${sha} -->`;
            const body = fs.readFileSync('l1-review-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            let page = 1;
            let existing = null;
            while (page <= 20) {
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number, per_page: 100, page,
              });
              if (!comments.length) break;
              existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) break;
              if (comments.length < 100) break;
              page += 1;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated review comment ${existing.id} for ${sha.slice(0, 12)}`);
            } else {
              const { data: created } = await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info(`Created review comment ${created.id} for ${sha.slice(0, 12)}`);
            }

      - name: Fail L1 when blockers exist
        if: steps.review.outputs.exit_code != '0'
        run: |
          echo "L1 存在阻断项，检查失败；不会进入 L2。详见 PR 评论或 Artifact。"
          exit 1

  # -------------------------------------------------------------------------
  # Job：L2 LLM 审核（仅 L1 成功后执行；不再重复跑 l1_review.py）
  # -------------------------------------------------------------------------
  l2:
    name: L2 LLM review
    needs: l1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install review tools
        run: pip install -r .github/scripts/review/requirements.txt

      - name: Download L1 report
        uses: actions/download-artifact@v7
        with:
          name: l1-review-report-${{ github.run_id }}
          path: .

      - name: Run L2 LLM review
        id: l2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: |
          set +e
          L1_ARG=""
          if [ -f l1-review.json ]; then
            L1_ARG="--l1-json l1-review.json"
          fi
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            python .github/scripts/review/l2_review.py \
              --base "${{ github.event.pull_request.base.sha }}" \
              --json l2-review.json \
              $L1_ARG
          else
            python .github/scripts/review/l2_review.py \
              --json l2-review.json \
              $L1_ARG
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Render L2 section
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          (github.event.action == 'opened' || github.event.action == 'synchronize')
        env:
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python .github/scripts/review/format_l2_comment.py \
            --json l2-review.json \
            --out l2-review-comment.md \
            --sha "$HEAD_SHA" \
            --run-url "$GITHUB_RUN_URL"

      - name: Upload L2 artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: l2-review-report-${{ github.run_id }}
          path: |
            l2-review.json
            l2-review-comment.md
          if-no-files-found: warn

      - name: Attach L2 to the same review comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          (github.event.action == 'opened' || github.event.action == 'synchronize')
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('l2-review-comment.md')) {
              core.warning('l2-review-comment.md missing; skip comment');
              return;
            }
            const sha = process.env.HEAD_SHA || '';
            const marker = `<!-- nimm-review-round:${sha} -->`;
            const slotStart = '<!-- nimm-l2-slot -->';
            const slotEnd = '<!-- /nimm-l2-slot -->';
            const l2 = fs.readFileSync('l2-review-comment.md', 'utf8').trim();
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            let page = 1;
            let existing = null;
            while (page <= 20) {
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number, per_page: 100, page,
              });
              if (!comments.length) break;
              existing = comments.find((c) => c.body && c.body.includes(marker));
              if (existing) break;
              if (comments.length < 100) break;
              page += 1;
            }
            const slot = `${slotStart}\n\n${l2}\n\n${slotEnd}`;
            if (!existing) {
              core.warning('L1 review comment not found; posting L2 as fallback');
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `${marker}\n## 审核 \`${sha.slice(0, 12)}\`\n\n${slot}\n`,
              });
              return;
            }
            let body = existing.body || '';
            const re = /<!-- nimm-l2-slot -->[\s\S]*?<!-- \/nimm-l2-slot -->/;
            if (re.test(body)) {
              body = body.replace(re, slot);
            } else {
              body = `${body.trim()}\n\n${slot}\n`;
            }
            await github.rest.issues.updateComment({
              owner, repo, comment_id: existing.id, body,
            });
            core.info(`Attached L2 to review comment ${existing.id}`);

      - name: Fail L2 when pipeline error
        if: steps.l2.outputs.exit_code != '0'
        run: |
          echo "L2 未成功完成（缺 API Key 或调用失败）。LLM 发现项本身不阻断；请检查 Secrets / 日志。"
          exit 1
